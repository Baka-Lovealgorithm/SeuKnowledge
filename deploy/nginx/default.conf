server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history mode: paths without a physical file return the SPA entry.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The browser calls /api relatively, so frontend and backend remain same-origin.
    # Disabling buffering is required for the streaming chat endpoint.
    location /api/ {
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
