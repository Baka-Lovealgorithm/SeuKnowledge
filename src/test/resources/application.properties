# 测试固定走本地磁盘存储后端。
#
# 为什么必须是 .properties 而不是 application-test.yml：
# 1) 两个 @SpringBootTest（KonwledgeRepoApplicationTests / ChatMessageStoreConcurrencyTest）
#    都未声明 @ActiveProfiles，靠命令行 -Dspring.profiles.active=dev 加载本机的 application-dev.yml；
#    新增 test profile 会覆盖 dev，反而丢掉本机 MySQL/Redis/ES 连接配置。
# 2) 本文件与主 application.yml（.yml）同时被加载，同名 key 以 .properties 优先；
#    且 application-dev.yml 未定义 seuknowledge.storage.type，因此这一行在任何 profile 下都生效，
#    与 -Dspring.profiles.active=dev 无冲突。
# 3) 这样单测不会因为本机没起 MinIO 而失败（MinioFileStorage 在 type=local 时根本不装配）。
seuknowledge.storage.type=local
